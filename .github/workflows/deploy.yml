name: Deploy static content to Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # Nada verificaba este proyecto antes de publicarlo: el workflow instalaba,
      # compilaba y desplegaba. El linter llevaba tiempo en rojo —trece errores,
      # seis de ellos un componente creado dentro del render— sin que nadie se
      # enterara, porque nada lo ejecutaba.
      #
      # Ahora es una puerta: si falla, no se despliega.
      - name: Lint
        run: npm run lint

      # Un linter tampoco puede atrapar `color: '#2ECC71'`: es JavaScript
      # perfectamente válido. Los mismos cinco colores llegaron a estar escritos
      # a mano treinta y una veces.
      - name: Revisar que el color viva en los tokens
        run: npm run revisar:color

      # El linter no puede ver un desbordamiento horizontal: no es un error de
      # código, es un ancho. La página entera se desplazaba de lado en todo
      # monitor por debajo de ~1150 px —incluido cualquier portátil— y nadie lo
      # notó, porque se trabaja en pantalla grande. Estas pruebas lo miden.
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de disposición
        run: npm test
        env:
          VITE_API_URL: https://api-de-prueba.invalido

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://encuadre-2026-api.sitio-392.workers.dev
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
