name: Verificación

# El workflow de despliegue solo corre al empujar a `main`, así que sus
# comprobaciones llegaban tarde: cuando fallaban, el fallo ya estaba mergeado.
# Este corre en el pull request, que es donde sirve saberlo.
on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # El límite por defecto de GitHub son seis horas. Un job colgado se quedaría
    # ahí consumiendo minutos de la cuenta antes de rendirse.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Versión de Playwright
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` lanza un apt-get e instala unos cuarenta paquetes de
      # sistema. Solo hace falta cuando la caché falla: la imagen de
      # ubuntu-latest ya trae las bibliotecas que Chromium necesita.
      - name: Instalar navegador de pruebas
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Pruebas de disposición
        run: npm test
        env:
          VITE_API_URL: https://api-de-prueba.invalido

      - name: Subir informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
