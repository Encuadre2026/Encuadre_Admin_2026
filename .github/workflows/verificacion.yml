name: Verificación

# El workflow de despliegue solo corre al empujar a `main`, así que sus
# comprobaciones llegaban tarde: cuando fallaban, el fallo ya estaba mergeado.
# Este corre en el pull request, que es donde sirve saberlo.
on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # El límite por defecto de GitHub son seis horas. Un job colgado se quedaría
    # ahí consumiendo minutos de la cuenta antes de rendirse.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Un linter no puede atrapar `color: '#2ECC71'`: es JavaScript válido.
      - name: Revisar que el color viva en los tokens
        run: npm run revisar:color

      - name: Versión de Playwright
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No se instalan dependencias del sistema. `--with-deps` lanzaba un
      # apt-get contra los espejos de Ubuntu para instalar bibliotecas que la
      # imagen de ubuntu-latest ya trae, y el 19 ago 2026 uno de esos espejos
      # dejó de responder y el paso se quedó reintentando media hora. Si algún
      # día faltara alguna, el navegador no arranca y la prueba falla en
      # segundos; la vuelta atrás es volver a poner `--with-deps`.
      - name: Instalar navegador de pruebas
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Pruebas de disposición
        run: npm test
        env:
          VITE_API_URL: https://api-de-prueba.invalido

      - name: Subir informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
