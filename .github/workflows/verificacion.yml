name: Verificación

# El workflow de despliegue solo corre al empujar a `main`, así que sus
# comprobaciones llegaban tarde: cuando fallaban, el fallo ya estaba mergeado.
# Este corre en el pull request, que es donde sirve saberlo.
on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de disposición
        run: npm test
        env:
          VITE_API_URL: https://api-de-prueba.invalido

      - name: Subir informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
