<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de administración del 36 FTD Encuadre 2026: padrón de participantes, validación de pagos y cupos por taller." />
    <!-- El panel es oscuro y solo oscuro. Sin `color-scheme`, el navegador
         pinta de blanco los controles nativos —el desplegable de talleres, la
         barra de desplazamiento, el autocompletado— y quedaban tres parches
         claros en una interfaz negra. `theme-color` tiñe además la barra del
         navegador en móvil, para que no haya un corte a mitad de pantalla. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Encuadre Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
